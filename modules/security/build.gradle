plugins {
    id 'java-library'
}

description = 'security-aggregator-module'

sourceSets {
    webMvcSmokeTest
}

configurations {
    webMvcSmokeTestImplementation.extendsFrom testImplementation
    webMvcSmokeTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    api project(':modules:security-jwt')
    api project(':modules:security-webmvc')

    webMvcSmokeTestImplementation sourceSets.main.output
    webMvcSmokeTestImplementation 'org.springframework.boot:spring-boot-starter-webmvc'
    webMvcSmokeTestImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    webMvcSmokeTestImplementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    webMvcSmokeTestRuntimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    webMvcSmokeTestRuntimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
}

def webMvcSmokeTest = tasks.register('webMvcSmokeTest', Test) {
    description = 'Runs the security and Web MVC consumer smoke tests.'
    group = 'verification'
    testClassesDirs = sourceSets.webMvcSmokeTest.output.classesDirs
    classpath = sourceSets.webMvcSmokeTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
}

tasks.named('jacocoTestReport') {
    dependsOn webMvcSmokeTest
    executionData webMvcSmokeTest.get()
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn webMvcSmokeTest
    executionData webMvcSmokeTest.get()
}

tasks.named('check') {
    dependsOn webMvcSmokeTest
}
