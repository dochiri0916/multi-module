name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run checks and changed coverage
        env:
          CHANGED_COVERAGE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./gradlew check -PchangedCoverageBaseRef="$CHANGED_COVERAGE_BASE_REF"

      - name: Run Domain and Application mutation tests
        run: ./gradlew :modules:security-domain:pitest :modules:security-application:pitest
